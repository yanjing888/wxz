            \n## 五维评分 JSON\n{{#merge.merged_json#}}\n\n## 学生实验报告（摘要依据）\n{{#parse.student_report#}}\n\n写一段 120-220 字的中文总评，面向教师，可直接贴到批改栏：\n\
