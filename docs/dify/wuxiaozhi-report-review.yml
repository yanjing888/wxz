app:
  name: 物小智-教师报告预评
  description: 教师端 report-review：输入学生报告文件 + 本实验目的与步骤。文档提取正文后，空报告短路；可评时五维并行打分并汇总建议分与评语。
  mode: advanced-chat
  icon_type: emoji
  icon: 📝
  icon_background: '#EEF2FF'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 我是物小智教师预评助手。请提交学生报告后，我会给出建议分和评语，需教师确认才作为正式成绩。
    suggested_questions:
    - 请对本份实验报告做预评
    - 给出建议分和可编辑评语
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: true
      allowed_file_types:
      - document
      allowed_file_extensions:
      - .docx
      - .doc
      - .pdf
      - .txt
      - .md
      allowed_file_upload_methods:
      - local_file
      number_limits: 1
  graph:
