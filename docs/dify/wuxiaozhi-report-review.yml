        code_language: python3
        code: "import json\nimport re\n\n\ndef _extract_obj(text):\n    if not text:\n        return {}\n    s = str(text).strip()\n\
          \    s = re.sub(r\"^```(?:json)?\", \"\", s, flags=re.I).strip()\n    s = re.sub(r\"```$\", \"\", s).strip()\n \
          \   try:\n        obj = json.loads(s)\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n\
          \        pass\n    m = re.search(r\"\\{[\\s\\S]*\\}\", s)\n    if not m:\n        return {}\n    try:\n        obj\
          \ = json.loads(m.group(0))\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n       \
          \ return {}\n\n\ndef main(final_text=\"\", merged_json=\"\", score10=0, score100=0, grade_band=\"\"):\n    merged\
          \ = _extract_obj(merged_json)\n    final = _extract_obj(final_text)\n    out = dict(merged)\n    out.update({k:\
          \ v for k, v in final.items() if v is not None and v != \"\"})\n    try:\n        score = float(score10)\n    except\
          \ Exception:\n        score = float(out.get(\"score\") or 0)\n    try:\n        s100 = int(float(score100))\n  \
          \  except Exception:\n        s100 = int(out.get(\"score100\") or round(score * 10))\n    if score <= 0 and s100\
          \ > 0:\n        score = round(s100 / 10.0, 1)\n    comment = str(out.get(\"comment\") or \"\").strip()\n    if not\
          \ comment:\n        comment = str(final_text or \"\").strip() or \"预评已完成，请教师核验分数与评语后确认。\"\n    result = {\n    \
          \    \"score\": round(float(score), 1),\n        \"score100\": s100,\n        \"maxScore\": 10,\n        \"gradeBand\"\
          : str(out.get(\"gradeBand\") or grade_band or \"\"),\n        \"comment\": comment,\n        \"dimensions\": out.get(\"\
          dimensions\") if isinstance(out.get(\"dimensions\"), list) else [],\n        \"risks\": out.get(\"risks\") if isinstance(out.get(\"\
          risks\"), list) else [],\n        \"needsTeacherConfirm\": True,\n    }\n    return {\"result_json\": json.dumps(result,\
          \ ensure_ascii=False)}\n"
        variables:
