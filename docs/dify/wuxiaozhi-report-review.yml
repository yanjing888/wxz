    nodes:
    - id: start
      type: custom
      width: 244
      height: 54
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 开始：报告文件 + 实验目的步骤
        type: start
        selected: false
        variables:
        - label: 学生实验报告
          variable: student_report_file
          type: file
          required: false
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .docx
          - .doc
          - .pdf
          - .txt
          - .md
          allowed_file_upload_methods:
          - local_file
          options: []
        - label: 实验目的与步骤
          variable: experiment_spec
          type: paragraph
          required: false
          options: []
          max_length: 12000
        - label: 实验名称
          variable: experiment_name
          type: text-input
          required: false
          options: []
          max_length: 200
        - label: 学生姓名
          variable: student_name
          type: text-input
          required: false
          options: []
          max_length: 80
        - label: 班级
          variable: student_class
          type: text-input
          required: false
          options: []
          max_length: 80
    - id: extract
      type: custom
      width: 244
      height: 54
      position:
        x: 360
        y: 300
      positionAbsolute:
        x: 360
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 节点01 从报告文件提取正文
        type: document-extractor
        selected: false
        variable_selector:
        - start
        - student_report_file
        is_array_file: false
    - id: parse
      type: custom
      width: 244
      height: 54
      position:
        x: 640
        y: 300
      positionAbsolute:
        x: 640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 节点02 对齐评分材料
        type: code
        selected: false
        code_language: python3
        code: "import re\n\n\ndef _clean(v):\n    if v is None:\n        return \"\"\n    return str(v).strip()\n\n\ndef _strip_html(text):\n\
          \    if not text:\n        return \"\"\n    s = str(text)\n    s = re.sub(r\"(?i)<br\\s*/?>\", \"\\n\", s)\n   \
          \ s = re.sub(r\"(?i)</(p|div|h[1-6]|li|tr|table)>\", \"\\n\", s)\n    s = re.sub(r\"(?i)<li[^>]*>\", \"- \", s)\n\
          \    s = re.sub(r\"<[^>]+>\", \" \", s)\n    s = s.replace(\"&nbsp;\", \" \").replace(\"&lt;\", \"<\").replace(\"\
          &gt;\", \">\").replace(\"&amp;\", \"&\")\n    s = re.sub(r\"[ \\t]+\", \" \", s)\n    s = re.sub(r\"\\n{3,}\", \"\
          \\n\\n\", s)\n    return s.strip()\n\n\ndef main(query=\"\", student_report=\"\", experiment_spec=\"\", experiment_name=\"\
          \", student_name=\"\", student_class=\"\"):\n    name = _clean(experiment_name) or \"大学物理实验\"\n    report = _strip_html(_clean(student_report))[:20000]\n\
          \    spec = _strip_html(_clean(experiment_spec))[:12000]\n    return {\n        \"query\": _clean(query) or \"请对照实验目的与步骤，对学生实验报告做预评（非终裁）。\"\
          ,\n        \"experiment_name\": name,\n        \"student_name\": _clean(student_name),\n        \"student_class\"\
          : _clean(student_class),\n        \"student_report\": report,\n        \"experiment_guide_text\": spec,\n    }\n"
        variables:
        - variable: student_report
          value_selector:
          - extract
          - text
        - variable: experiment_spec
          value_selector:
          - start
          - experiment_spec
        - variable: experiment_name
          value_selector:
          - start
          - experiment_name
        - variable: student_name
          value_selector:
          - start
          - student_name
        - variable: student_class
          value_selector:
          - start
          - student_class
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          query:
            type: string
            children: null
          experiment_name:
            type: string
            children: null
          student_name:
            type: string
            children: null
          student_class:
            type: string
            children: null
          student_report:
            type: string
            children: null
          experiment_guide_text:
            type: string
            children: null
    - id: metrics
      type: custom
      width: 244
      height: 54
      position:
        x: 920
        y: 300
      positionAbsolute:
        x: 920
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 节点03 硬性指标与风险标记
        type: code
        selected: false
        code_language: python3
        code: "import re\n\n\ndef main(student_report=\"\", experiment_guide_text=\"\"):\n    text = student_report or \"\"\
          \n    guide = experiment_guide_text or \"\"\n    has_uncertainty = bool(re.search(r\"不确定|误差|标准差|相对|±|\\+/-\", text))\n\
          \    has_unit = bool(re.search(r\"(mm|cm|m|nm|N|kN|MPa|Pa|kg|g|s|V|A|Ω|ohm|℃)\", text, re.I))\n    word_count =\
          \ len(re.sub(r\"\\s+\", \"\", text))\n    section_hits = []\n    for label in [\"实验目的\", \"实验原理\", \"实验仪器\", \"\
          实验步骤\", \"数据\", \"结果\", \"讨论\", \"分析\"]:\n        if label in text:\n            section_hits.append(label)\n  \
          \  risk = []\n    if word_count < 180:\n        risk.append(\"正文偏短\")\n    if not has_uncertainty:\n        risk.append(\"\
          缺少不确定度/误差分析\")\n    if not has_unit:\n        risk.append(\"单位痕迹不足\")\n    if not guide:\n        risk.append(\"\
          未收到实验目的与步骤\")\n    if len(section_hits) < 3:\n        risk.append(\"报告结构不完整\")\n    review_route = \"empty\" if\
          \ word_count < 80 else \"review\"\n    return {\n        \"word_count\": word_count,\n        \"section_count\"\
          : len(section_hits),\n        \"filled_sections\": \"、\".join(section_hits) if section_hits else \"未识别到标准章节\",\n\
          \        \"has_uncertainty\": has_uncertainty,\n        \"has_unit\": has_unit,\n        \"risk_flags\": \"；\".join(risk)\
          \ if risk else \"未发现明显硬性风险\",\n        \"review_route\": review_route,\n    }\n"
        variables:
        - variable: student_report
          value_selector:
          - parse
          - student_report
        - variable: experiment_guide_text
          value_selector:
          - parse
          - experiment_guide_text
        outputs:
          word_count:
            type: number
            children: null
          section_count:
            type: number
            children: null
          filled_sections:
            type: string
            children: null
          has_uncertainty:
            type: boolean
            children: null
          has_unit:
            type: boolean
            children: null
          risk_flags:
            type: string
            children: null
          review_route:
            type: string
            children: null
    - id: router
      type: custom
      width: 244
      height: 124
      position:
        x: 1200
        y: 280
      positionAbsolute:
        x: 1200
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 节点04 是否可评
        type: if-else
        selected: false
        cases:
        - id: empty
          case_id: empty
          logical_operator: and
          conditions:
          - id: route-empty
            varType: string
            variable_selector:
            - metrics
            - review_route
            comparison_operator: is
            value: empty
    - id: empty
      type: custom
      width: 244
      height: 54
      position:
        x: 1540
        y: 40
      positionAbsolute:
        x: 1540
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支A 空报告直接给分
        type: code
        selected: false
        code_language: python3
        code: "import json\n\n\ndef main(experiment_name=\"\", student_name=\"\", word_count=0, risk_flags=\"\"):\n    name\
          \ = experiment_name or \"本次实验\"\n    who = student_name or \"该生\"\n    comment = (\n        f\"{who}的《{name}》报告正文过短或几乎未填写（约\
          \ {word_count} 字），\"\n        \"无法按完整性、数据、误差、结论、思考题五维可靠评分。\"\n        \"建议退回补全实验目的、原理、数据与结论后再评。\"\n        f\"硬性提示：{risk_flags\
          \ or '正文不足'}。\"\n    )\n    result = {\n        \"score\": 1.5,\n        \"score100\": 15,\n        \"maxScore\"\
          : 10,\n        \"gradeBand\": \"不及格\",\n        \"comment\": comment,\n        \"dimensions\": [],\n        \"risks\"\
          : [\"正文过短，未进入五维评分\"],\n        \"needsTeacherConfirm\": True,\n    }\n    return {\"result_json\": json.dumps(result,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: experiment_name
          value_selector:
          - parse
          - experiment_name
        - variable: student_name
          value_selector:
          - parse
          - student_name
        - variable: word_count
          value_selector:
          - metrics
          - word_count
        - variable: risk_flags
          value_selector:
          - metrics
          - risk_flags
        outputs:
          result_json:
            type: string
            children: null
    - id: answer_empty
      type: custom
      width: 244
      height: 54
      position:
        x: 1600
        y: 40
      positionAbsolute:
        x: 1600
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 回答：空报告预评
        type: answer
        selected: false
        answer: '{{#empty.result_json#}}'
        variables: []
    - id: completeness
      type: custom
      width: 244
      height: 54
      position:
        x: 1540
        y: 160
      positionAbsolute:
        x: 1540
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支B1 完整性
        type: llm
        selected: false
        model: &id001
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.15
        prompt_template:
        - id: system-prompt
          role: system
          text: "你是大学物理实验报告预评教师，只负责「完整性」这一维打分。\n\n实验：{{#parse.experiment_name#}}\n学生：{{#parse.student_name#}}（{{#parse.student_class#}}）\n\
            \n## 本实验应完成什么（目的、步骤与要求）\n{{#parse.experiment_guide_text#}}\n\n## 学生提交的实验报告\n{{#parse.student_report#}}\n\n客观指标：字数\
            \ {{#metrics.word_count#}}；已识别章节 {{#metrics.filled_sections#}}；硬性风险 {{#metrics.risk_flags#}}\n\n评分要点：\n对照指导书检查实验目的、原理、仪器、步骤、数据与处理、结果、分析与讨论是否齐全。缺章、空章、明显复制提纲扣分。\n\
            \n有实验步骤要求记录的量，报告里却完全没有对应数据，必须在 issues 中指出。\n\nJSON 字段：\n{\n  \"dimension\": \"完整性\",\n  \"score\": 0,\n  \"max\"\
            : 20,\n  \"comment\": \"该维评语\",\n  \"issues\": []\n}\n\n输出约束（必须遵守）：\n- 只输出一个 JSON 对象，不要 Markdown，不要代码块，不要解释性前后文。\n\
            - score 必须是 0 到 20 的整数。\n- comment 用中文，2-5 句，具体指出报告里出现或缺失的内容，禁止空套话。\n- issues 为字符串数组，没有问题则给空数组。\n- 只根据学生已写内容和过程数据判断，不得替学生补写未出现的测量值，不得编造数据。\n\
            - 这是预评，不是终裁。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: data_quality
      type: custom
      width: 244
      height: 54
      position:
        x: 1540
        y: 280
      positionAbsolute:
        x: 1540
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支B2 数据可信度
        type: llm
        selected: false
        model: *id001
        prompt_template:
        - id: system-prompt
          role: system
          text: "你是大学物理实验报告预评教师，只负责「数据可信度」这一维打分。\n\n实验：{{#parse.experiment_name#}}\n学生：{{#parse.student_name#}}（{{#parse.student_class#}}）\n\
            \n## 本实验应完成什么（目的、步骤与要求）\n{{#parse.experiment_guide_text#}}\n\n## 学生提交的实验报告\n{{#parse.student_report#}}\n\n客观指标：字数\
            \ {{#metrics.word_count#}}；已识别章节 {{#metrics.filled_sections#}}；硬性风险 {{#metrics.risk_flags#}}\n\n评分要点：\n核对报告数据是否与过程记录方向一致、是否有单位、是否像估算/编造、表格是否可读。无数据最高\
            \ 6 分。\n\n不得把指导书例题数据当成学生数据。\n\nJSON 字段：\n{\n  \"dimension\": \"数据可信度\",\n  \"score\": 0,\n  \"max\": 20,\n  \"\
            comment\": \"该维评语\",\n  \"issues\": []\n}\n\n输出约束（必须遵守）：\n- 只输出一个 JSON 对象，不要 Markdown，不要代码块，不要解释性前后文。\n- score\
            \ 必须是 0 到 20 的整数。\n- comment 用中文，2-5 句，具体指出报告里出现或缺失的内容，禁止空套话。\n- issues 为字符串数组，没有问题则给空数组。\n- 只根据学生已写内容和过程数据判断，不得替学生补写未出现的测量值，不得编造数据。\n\
            - 这是预评，不是终裁。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: error_analysis
      type: custom
      width: 244
      height: 54
      position:
        x: 1540
        y: 400
      positionAbsolute:
        x: 1540
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支B3 误差分析
        type: llm
        selected: false
        model: *id001
        prompt_template:
        - id: system-prompt
          role: system
          text: "你是大学物理实验报告预评教师，只负责「误差分析」这一维打分。\n\n实验：{{#parse.experiment_name#}}\n学生：{{#parse.student_name#}}（{{#parse.student_class#}}）\n\
            \n## 本实验应完成什么（目的、步骤与要求）\n{{#parse.experiment_guide_text#}}\n\n## 学生提交的实验报告\n{{#parse.student_report#}}\n\n客观指标：字数\
            \ {{#metrics.word_count#}}；已识别章节 {{#metrics.filled_sections#}}；硬性风险 {{#metrics.risk_flags#}}\n\n评分要点：\n看是否写出误差来源、不确定度或相对误差、数据处理思路是否与本实验匹配。空泛套话扣分。\n\
            \n只评价学生已写的误差/不确定度内容，不要替学生补算。\n\nJSON 字段：\n{\n  \"dimension\": \"误差分析\",\n  \"score\": 0,\n  \"max\": 20,\n  \"\
            comment\": \"该维评语\",\n  \"issues\": []\n}\n\n输出约束（必须遵守）：\n- 只输出一个 JSON 对象，不要 Markdown，不要代码块，不要解释性前后文。\n- score\
            \ 必须是 0 到 20 的整数。\n- comment 用中文，2-5 句，具体指出报告里出现或缺失的内容，禁止空套话。\n- issues 为字符串数组，没有问题则给空数组。\n- 只根据学生已写内容和过程数据判断，不得替学生补写未出现的测量值，不得编造数据。\n\
            - 这是预评，不是终裁。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: conclusion
      type: custom
      width: 244
      height: 54
      position:
        x: 1540
        y: 520
      positionAbsolute:
        x: 1540
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支B4 结论质量
        type: llm
        selected: false
        model: *id001
        prompt_template:
