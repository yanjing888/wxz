    - id: merge
      type: custom
      width: 244
      height: 54
      position:
        x: 1600
        y: 400
      positionAbsolute:
        x: 1600
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 节点04 五维分数汇总
        type: code
        selected: false
        code_language: python3
        code: "import json\nimport re\n\n\ndef _extract_obj(text):\n    if not text:\n        return {}\n    s = str(text).strip()\n\
          \    s = re.sub(r\"^```(?:json)?\", \"\", s, flags=re.I).strip()\n    s = re.sub(r\"```$\", \"\", s).strip()\n \
          \   try:\n        obj = json.loads(s)\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n\
          \        pass\n    m = re.search(r\"\\{[\\s\\S]*\\}\", s)\n    if not m:\n        return {}\n    try:\n        obj\
          \ = json.loads(m.group(0))\n        return obj if isinstance(obj, dict) else {}\n    except Exception:\n       \
          \ return {}\n\n\ndef _score(obj, default=0):\n    try:\n        n = float(obj.get(\"score\", default))\n    except\
          \ Exception:\n        n = default\n    if n < 0:\n        n = 0\n    if n > 20:\n        n = 20\n    return int(round(n))\n\
          \n\ndef _band(score100):\n    if score100 >= 90:\n        return \"优秀\"\n    if score100 >= 80:\n        return\
          \ \"良好\"\n    if score100 >= 70:\n        return \"中等\"\n    if score100 >= 60:\n        return \"及格\"\n    return\
          \ \"不及格\"\n\n\ndef main(completeness_json=\"\", data_json=\"\", error_json=\"\", conclusion_json=\"\", think_json=\"\
          \", risk_flags=\"\"):\n    items = [\n        _extract_obj(completeness_json),\n        _extract_obj(data_json),\n\
          \        _extract_obj(error_json),\n        _extract_obj(conclusion_json),\n        _extract_obj(think_json),\n\
          \    ]\n    names = [\"完整性\", \"数据可信度\", \"误差分析\", \"结论质量\", \"思考题与讨论\"]\n    dimensions = []\n    total = 0\n \
          \   issues = []\n    for i, obj in enumerate(items):\n        name = obj.get(\"dimension\") or names[i]\n      \
          \  score = _score(obj, 0 if obj else 10)\n        comment = str(obj.get(\"comment\") or \"\").strip()\n        dim_issues\
          \ = obj.get(\"issues\") if isinstance(obj.get(\"issues\"), list) else []\n        dimensions.append({\n        \
          \    \"dimension\": name,\n            \"score\": score,\n            \"max\": 20,\n            \"comment\": comment,\n\
          \            \"issues\": [str(x) for x in dim_issues if str(x).strip()],\n        })\n        total += score\n \
          \       issues.extend([str(x) for x in dim_issues if str(x).strip()])\n    if risk_flags and risk_flags != \"未发现明显硬性风险\"\
          :\n        issues.append(str(risk_flags))\n    score10 = round(total / 10.0, 1)\n    merged = {\n        \"score\"\
          : score10,\n        \"score100\": total,\n        \"maxScore\": 10,\n        \"gradeBand\": _band(total),\n    \
          \    \"dimensions\": dimensions,\n        \"risks\": list(dict.fromkeys(issues)),\n        \"needsTeacherConfirm\"\
          : True,\n    }\n    return {\n        \"score10\": score10,\n        \"score100\": total,\n        \"grade_band\"\
          : merged[\"gradeBand\"],\n        \"merged_json\": json.dumps(merged, ensure_ascii=False),\n        \"risk_summary\"\
          : \"；\".join(merged[\"risks\"]) if merged[\"risks\"] else \"未发现明显风险\",\n    }\n"
        variables:
        - variable: completeness_json
          value_selector:
          - completeness
          - text
        - variable: data_json
          value_selector:
          - data_quality
          - text
        - variable: error_json
          value_selector:
          - error_analysis
          - text
        - variable: conclusion_json
          value_selector:
          - conclusion
          - text
        - variable: think_json
          value_selector:
          - think
          - text
        - variable: risk_flags
          value_selector:
          - metrics
          - risk_flags
        outputs:
          score10:
            type: number
            children: null
          score100:
            type: number
            children: null
          grade_band:
            type: string
            children: null
          merged_json:
            type: string
            children: null
          risk_summary:
            type: string
            children: null
