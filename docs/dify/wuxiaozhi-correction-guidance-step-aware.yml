app:
  description: 物小智实验台 enriched 工作流：HTTP 拉 manifest → 步骤上下文 → vision/text 分流；文本侧含问题分类器、检索 query 改写、双库检索、模板聚合、初稿+质检；视觉侧含双库检索、JSON
    纠错、regions 提取、反馈+质检。导入后绑定教学库与纠错规则库，配置 WXZ_BACKEND_BASE_URL。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
