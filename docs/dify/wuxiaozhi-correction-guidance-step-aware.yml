        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我是物小智实验台助教。我会结合你当前的实验与步骤回答问题；上传图片会做视觉纠错并在图上标注问题区域。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 牛顿环实验里为什么要保持同一方向读数？
    - 空气劈尖测量时，L 和 L′ 分别代表什么？
    - 读数显微镜主尺和鼓轮小数怎么合读？
    - 我上传一张当前步骤照片，请帮我看看操作有没有问题。
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
