        title: 步骤上下文组装
        type: code
        code_language: python3
        code: "import json\n\n\ndef _clean(v):\n    if v is None:\n        return \"\"\n    return str(v).strip()\n\n\ndef\
          \ _pick_step(steps, step_id):\n    if not isinstance(steps, dict) or not step_id:\n        return {}\n    if step_id\
          \ in steps:\n        return steps.get(step_id) or {}\n    for key in (step_id, str(int(step_id)) if step_id.isdigit()\
          \ else step_id):\n        if key in steps:\n            return steps.get(key) or {}\n    return {}\n\n\ndef _format_tut_guide(tut):\n\
          \    if not isinstance(tut, dict):\n        return \"\"\n    lines = []\n    steps = tut.get(\"steps\") or []\n\
          \    warnings = tut.get(\"warnings\") or []\n    if steps:\n        lines.append(\"操作要点:\")\n        for item in\
          \ steps:\n            lines.append(f\"- {item}\")\n    if warnings:\n        lines.append(\"注意:\")\n        for\
          \ item in warnings:\n            lines.append(f\"- {item}\")\n    return \"\\n\".join(lines)\n\n\ndef main(\n  \
          \  mode=\"text\",\n    query=\"\",\n    experiment_code=\"\",\n    experiment_type=\"\",\n    step_id=\"\",\n  \
          \  step_title=\"\",\n    step_desc=\"\",\n    step_guide=\"\",\n    step_correction_mode=\"\",\n    data_json=\"\
          \",\n    teaching_section=\"\",\n    rules_section=\"\",\n    retrieval_tags=\"\",\n    kb_context=\"\",\n    repeat_hint=\"\
          \",\n    http_body=\"\",\n):\n    mode = _clean(mode) or \"text\"\n    query = _clean(query)\n    experiment_code\
          \ = _clean(experiment_code)\n    experiment_type = _clean(experiment_type)\n    step_id = _clean(step_id)\n    step_title\
          \ = _clean(step_title)\n    step_desc = _clean(step_desc)\n    step_guide = _clean(step_guide)\n    step_correction_mode\
          \ = _clean(step_correction_mode)\n    data_json = _clean(data_json)\n    teaching_section = _clean(teaching_section)\n\
          \    rules_section = _clean(rules_section)\n    retrieval_tags = _clean(retrieval_tags)\n    kb_context = _clean(kb_context)\n\
          \    repeat_hint = _clean(repeat_hint)\n\n    correction_mode_step = step_correction_mode\n    body = _clean(http_body)\n\
          \    if body:\n        try:\n            cfg = json.loads(body)\n            steps = cfg.get(\"steps\") or {}\n\
          \            step = _pick_step(steps, step_id)\n            if not step_title:\n                step_title = _clean(step.get(\"\
          title\"))\n            if not step_desc:\n                step_desc = _clean(step.get(\"desc\"))\n            if\
          \ not step_guide:\n                step_guide = _format_tut_guide(step.get(\"tut\") or {})\n            if not correction_mode_step:\n\
          \                correction_mode_step = _clean(step.get(\"correctionMode\"))\n        except Exception:\n      \
          \      pass\n\n    step_part = \" \".join(x for x in [f\"step:{step_id}\" if step_id else \"\", step_title, step_desc]\
          \ if x)\n    tag_part = retrieval_tags or experiment_code\n    section_teaching = teaching_section or (f\"{experiment_code}.step.{step_id}.teaching\"\
          \ if step_id else experiment_code)\n    section_rules = rules_section or (f\"{experiment_code}.step.{step_id}.rules\"\
          \ if step_id else experiment_code)\n\n    data_part = f\" data:{data_json[:800]}\" if data_json else \"\"\n    base\
          \ = f\"{experiment_type} {experiment_code} {step_part} {tag_part} {query}{data_part}\"\n\n    if mode == \"vision\"\
          :\n        retrieval_query_teaching = f\"{base} 步骤目标 仪器要求 操作背景 {section_teaching}\"\n        retrieval_query_rules\
          \ = f\"{base} 视觉纠错 rule_id severity evidence fix_instruction {section_rules}\"\n    else:\n        retrieval_query_teaching\
          \ = f\"{base} 实验原理 操作步骤 数据处理 仪器使用 {section_teaching}\"\n        retrieval_query_rules = f\"{base} 操作错误 读数方法 记录规范\
          \ 数据纠错 {section_rules}\"\n\n    if experiment_code and step_id and (step_title or step_guide or step_desc):\n  \
