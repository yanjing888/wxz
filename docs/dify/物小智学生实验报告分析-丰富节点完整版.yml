app:
  name: 物小智学生实验报告分析-丰富节点完整版
  description: 学生端报告助手 Dify Chatflow：解析报告输入、计算质量指标、分动作路由，并通过结构完整性、数据可信度、误差分析、段落润色、个性复盘和总控质检等多节点生成可执行建议。
  mode: advanced-chat
  icon_type: emoji
  icon: 🧪
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我是物小智报告助手。我会结合实验过程数据检查报告完整性、数据可信度和误差分析，也可以润色当前段落。
    suggested_questions:
    - 检查我的报告还缺什么
    - 帮我润色当前段落
    - 根据本次记录生成复盘建议
    suggested_questions_after_answer:
      enabled: true
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: false
      allowed_file_types: []
      allowed_file_extensions: []
      allowed_file_upload_methods: []
      number_limits: 0
  graph:
    edges:
    - id: start-parse
      source: start
      sourceHandle: source
      target: parse
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: code
      zIndex: 0
    - id: parse-metrics
      source: parse
      sourceHandle: source
      target: metrics
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: code
      zIndex: 0
    - id: metrics-router
      source: metrics
      sourceHandle: source
      target: router
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: code
      zIndex: 0
    - id: router-completeness
      source: router
      sourceHandle: source
      target: completeness
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: llm
      zIndex: 0
    - id: completeness-data
      source: completeness
      sourceHandle: source
      target: data_quality
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
      zIndex: 0
    - id: data-error
      source: data_quality
      sourceHandle: source
      target: error_analysis
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
      zIndex: 0
    - id: error-polish
      source: error_analysis
      sourceHandle: source
      target: polish
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
      zIndex: 0
    - id: polish-recap
      source: polish
      sourceHandle: source
      target: recap
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
      zIndex: 0
    - id: recap-summary
      source: recap
      sourceHandle: source
      target: summary_template
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
