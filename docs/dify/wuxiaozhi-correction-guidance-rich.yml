        audio_file_size_limit: 50
        batch_count_limit: 50
        file_size_limit: 50
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我是物小智实验台助教。我会先理解你的问题类型，再结合当前实验步骤与知识库回答；上传图片会做分步视觉纠错并标注问题区域。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 牛顿环实验里为什么要保持同一方向读数？
    - 我上传一张牛顿环视场照片，请帮我判断环心和十字丝是否对准。
    - 暗环直径测量时怎样避免把弦长当成直径？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
