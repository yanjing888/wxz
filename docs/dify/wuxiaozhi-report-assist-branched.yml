    - id: parse
      type: custom
      width: 244
      height: 54
      position:
        x: 360
        y: 300
      positionAbsolute:
        x: 360
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 输入解析
        type: code
        selected: false
        code_language: python3
        code: "import json\n\n\ndef _clean(v):\n    if v is None:\n        return \"\"\n    return str(v).strip()\n\n\ndef\
          \ main(\n    query=\"\",\n    action=\"run\",\n    experiment_code=\"\",\n    experiment_name=\"\",\n    section=\"\
          \",\n    sectionLabel=\"\",\n    text=\"\",\n    localCheckSummary=\"\",\n    purpose=\"\",\n    principle=\"\"\
          ,\n    apparatus=\"\",\n    procedure=\"\",\n    data=\"\",\n    results=\"\",\n    discussion=\"\",\n    report_context=\"\
          \",\n    data_logs_json=\"\",\n    corrections_json=\"\",\n    step_summaries_json=\"\",\n    session_summary=\"\
          \",\n):\n    sections = {\n        \"purpose\": _clean(purpose),\n        \"principle\": _clean(principle),\n  \
          \      \"apparatus\": _clean(apparatus),\n        \"procedure\": _clean(procedure),\n        \"data\": _clean(data),\n\
          \        \"results\": _clean(results),\n        \"discussion\": _clean(discussion),\n    }\n    action = (_clean(action)\
          \ or \"run\").lower()\n    if action not in [\"polish\", \"check\", \"review\", \"recap\", \"draft\", \"run\"]:\n\
          \        action = \"run\"\n    experiment_name = _clean(experiment_name) or _clean(experiment_code) or \"大学物理实验\"\
          \n    section = _clean(section)\n    section_label = _clean(sectionLabel) or section\n    target_text = _clean(text)\
          \ or sections.get(section, \"\")\n    full_report = \"\\n\\n\".join(\n        f\"{key}: {value}\" for key, value\
          \ in sections.items() if value\n    )\n    if not full_report and target_text:\n        full_report = f\"{section_label}:\
          \ {target_text}\"\n    if not _clean(query):\n        if action == \"polish\":\n            query = f\"请整理并润色《{experiment_name}》报告的{section_label}。\"\
          \n        elif action == \"check\":\n            query = f\"请检查《{experiment_name}》实验报告是否完整规范。\"\n        elif action\
          \ == \"review\":\n            query = f\"请对《{experiment_name}》实验报告做教师预评。\"\n        else:\n            query = f\"\
          请分析《{experiment_name}》实验报告并给出改进建议。\"\n\n    return {\n        \"action\": action,\n        \"query\": _clean(query),\n\
          \        \"experiment_code\": _clean(experiment_code),\n        \"experiment_name\": experiment_name,\n        \"\
          section\": section,\n        \"section_label\": section_label,\n        \"target_text\": target_text,\n        \"\
          full_report\": full_report,\n        \"local_check_summary\": _clean(localCheckSummary),\n        \"report_context_text\"\
          : _clean(report_context)[:6000],\n        \"data_logs_json\": _clean(data_logs_json)[:4000],\n        \"corrections_json\"\
          : _clean(corrections_json)[:4000],\n        \"step_summaries_json\": _clean(step_summaries_json)[:4000],\n     \
          \   \"session_summary\": _clean(session_summary)[:2000],\n    }\n"
        variables:
        - variable: action
          value_selector:
          - start
          - action
        - variable: experiment_code
          value_selector:
          - start
          - experiment_code
        - variable: experiment_name
          value_selector:
          - start
          - experiment_name
        - variable: section
          value_selector:
          - start
          - section
        - variable: sectionLabel
          value_selector:
          - start
          - sectionLabel
        - variable: text
          value_selector:
          - start
          - text
        - variable: localCheckSummary
          value_selector:
          - start
          - localCheckSummary
        - variable: purpose
          value_selector:
          - start
          - purpose
        - variable: principle
          value_selector:
          - start
          - principle
        - variable: apparatus
          value_selector:
          - start
          - apparatus
        - variable: procedure
          value_selector:
          - start
          - procedure
        - variable: data
          value_selector:
          - start
          - data
        - variable: results
          value_selector:
          - start
          - results
        - variable: discussion
          value_selector:
          - start
          - discussion
        - variable: report_context
          value_selector:
          - start
          - report_context
        - variable: data_logs_json
          value_selector:
          - start
          - data_logs_json
        - variable: corrections_json
          value_selector:
          - start
          - corrections_json
        - variable: step_summaries_json
          value_selector:
          - start
          - step_summaries_json
        - variable: session_summary
          value_selector:
          - start
          - session_summary
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          action:
            type: string
            children: null
          query:
            type: string
            children: null
          experiment_code:
            type: string
            children: null
          experiment_name:
            type: string
            children: null
          section:
            type: string
            children: null
          section_label:
            type: string
            children: null
          target_text:
            type: string
            children: null
          full_report:
            type: string
            children: null
          local_check_summary:
            type: string
            children: null
          report_context_text:
            type: string
            children: null
          data_logs_json:
            type: string
            children: null
          corrections_json:
            type: string
            children: null
          step_summaries_json:
            type: string
            children: null
          session_summary:
            type: string
            children: null
    - id: metrics
      type: custom
      width: 244
      height: 54
      position:
        x: 640
        y: 300
      positionAbsolute:
        x: 640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 报告指标
        type: code
        selected: false
        code_language: python3
        code: "import json\nimport re\n\n\ndef _safe_json(value, default):\n    if not value:\n        return default\n  \
          \  try:\n        return json.loads(value) if isinstance(value, str) else value\n    except Exception:\n        return\
          \ default\n\n\ndef main(full_report=\"\", data_logs_json=\"\", corrections_json=\"\", local_check_summary=\"\",\
          \ target_text=\"\"):\n    text = full_report or target_text or \"\"\n    sections = [line for line in text.splitlines()\
          \ if \":\" in line[:20]]\n    data_logs = _safe_json(data_logs_json, [])\n    corrections = _safe_json(corrections_json,\
          \ [])\n    has_uncertainty = bool(re.search(r\"不确定|误差|标准差|相对|±|\\\\+/-\", text))\n    has_unit = bool(re.search(r\"\
          (mm|cm|m|nm|N|kN|MPa|Pa|kg|g|s|V|A|Ω|ohm|℃)\", text, re.I))\n    word_count = len(re.sub(r\"\\s+\", \"\", text))\n\
          \    missing = []\n    for name in [\"purpose\", \"principle\", \"apparatus\", \"procedure\", \"data\", \"results\"\
          , \"discussion\"]:\n        if name not in text:\n            missing.append(name)\n    risk = []\n    if word_count\
          \ < 220:\n        risk.append(\"正文偏短\")\n    if not has_uncertainty:\n        risk.append(\"缺少不确定度/误差分析\")\n   \
          \ if not has_unit:\n        risk.append(\"单位痕迹不足\")\n    if not data_logs:\n        risk.append(\"没有结构化数据记录\")\n\
          \    if corrections:\n        risk.append(\"存在过程纠错记录\")\n    return {\n        \"word_count\": word_count,\n   \
          \     \"section_count\": len(sections),\n        \"data_log_count\": len(data_logs) if isinstance(data_logs, list)\
          \ else 0,\n        \"correction_count\": len(corrections) if isinstance(corrections, list) else 0,\n        \"has_uncertainty\"\
          : has_uncertainty,\n        \"has_unit\": has_unit,\n        \"risk_flags\": \"；\".join(risk) if risk else \"未发现明显硬性风险\"\
          ,\n        \"local_check_summary\": local_check_summary,\n    }\n"
        variables:
        - variable: full_report
          value_selector:
          - parse
          - full_report
        - variable: data_logs_json
          value_selector:
          - parse
          - data_logs_json
        - variable: corrections_json
          value_selector:
          - parse
          - corrections_json
        - variable: local_check_summary
          value_selector:
          - parse
          - local_check_summary
        - variable: target_text
          value_selector:
          - parse
          - target_text
        outputs:
          word_count:
            type: number
            children: null
          section_count:
            type: number
            children: null
          data_log_count:
            type: number
            children: null
          correction_count:
            type: number
            children: null
          has_uncertainty:
            type: boolean
            children: null
          has_unit:
            type: boolean
            children: null
          risk_flags:
            type: string
            children: null
          local_check_summary:
            type: string
            children: null
    - id: classifier
      type: custom
      width: 244
      height: 54
      position:
        x: 920
        y: 280
      positionAbsolute:
        x: 920
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 报告意图分类
        type: question-classifier
        selected: false
        instruction: 你是物小智报告助手路由器。根据用户问题选择最匹配的分支：1=检查报告完整性、还缺什么章节；2=误差分析、不确定度、分析与讨论；3=把测量数据整理成表格；4=段落润色、写法建议或其他综合问题。若同时涉及多项，选最主要的一项。
        instructions: ''
        query_variable_selector:
        - parse
        - query
        classes:
        - id: '1'
          name: 检查报告完整性、还缺什么、遗漏章节
        - id: '2'
          name: 误差分析、不确定度、分析与讨论
        - id: '3'
          name: 整理测量数据为 Markdown 表格
        - id: '4'
          name: 段落润色、写法建议或其他综合问题
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.1
        vision:
          enabled: false
    - id: llm_check
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 80
      positionAbsolute:
        x: 1500
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：完整性检查
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告结构审阅教师。请只依据输入文本检查完整性，不编造学生未写的内容。


            实验：{{#parse.experiment_name#}}

            本地检查：{{#metrics.local_check_summary#}}

            字数：{{#metrics.word_count#}}；章节数：{{#metrics.section_count#}}

            报告正文：

            {{#parse.full_report#}}


            输出要求：

            1. 用“完整性结论 / 必补项目 / 可优化项目”三段。

            2. 必补项目要指出缺的是哪个章节、缺什么证据或数据。

            3. 不要给最终成绩。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_error
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 240
      positionAbsolute:
        x: 1500
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：误差分析
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验误差分析导师。请根据纠错记录和报告讨论段，判断误差分析是否贴合本次实验。


            实验：{{#parse.experiment_name#}}

            纠错记录 JSON：

            {{#parse.corrections_json#}}


            报告正文：

            {{#parse.full_report#}}


            输出要求：

            1. 找出最应该写入“分析与讨论”的 2-3 个误差来源。

            2. 每个误差来源必须说明来自哪条过程证据、可能影响方向、如何改进。

            3. 如果没有过程证据，只给通用误差分析框架并说明证据不足。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_table
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 400
      positionAbsolute:
        x: 1500
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：数据表格
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告数据整理助手。


            实验：{{#parse.experiment_name#}}

            数据记录 JSON：

            {{#parse.data_logs_json#}}


            用户问题：{{#parse.query#}}


            请把测量数据整理成 **Markdown 表格**（可直接粘贴进报告）：

            1. 按实验步骤分组，每组一个表

            2. 表头用中文物理量名与单位

            3. 若 JSON 中缺字段，用「—」占位并说明

            4. 表格后附 1–2 句还可补充的计算/不确定度列建议

            禁止虚构测量值。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_general
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 560
      positionAbsolute:
        x: 1500
        y: 560
