app:
  name: 物小智学生实验报告助手-多分支版
  description: 学生端 report-assist：问题分类器路由到完整性/误差/表格/综合四条互斥支路，每次只执行一条 LLM。
  mode: advanced-chat
  icon_type: emoji
  icon: 📝
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我是物小智报告助手。我可以检查报告缺项、整理误差分析、生成数据表格，或润色段落。
    suggested_questions:
    - 帮我检查报告还缺什么
    - 根据本次实验记录，帮我整理误差分析思路
    - 帮我把测量数据整理成表格
    suggested_questions_after_answer:
      enabled: true
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: false
      allowed_file_types: []
      allowed_file_extensions: []
      allowed_file_upload_methods: []
      number_limits: 0
  graph:
    edges:
    - id: start-parse
      source: start
      sourceHandle: source
      target: parse
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: code
      zIndex: 0
    - id: parse-metrics
      source: parse
      sourceHandle: source
      target: metrics
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: code
      zIndex: 0
    - id: metrics-classifier
      source: metrics
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: question-classifier
      zIndex: 0
    - id: cls-check
      source: classifier
      sourceHandle: '1'
      target: llm_check
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-error
      source: classifier
      sourceHandle: '2'
      target: llm_error
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-table
      source: classifier
      sourceHandle: '3'
      target: llm_table
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-general
      source: classifier
      sourceHandle: '4'
      target: llm_general
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: check-answer
      source: llm_check
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    - id: error-answer
      source: llm_error
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    - id: table-answer
