      data:
        title: 分支：综合/润色
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告写作助手。


            实验：{{#parse.experiment_name#}}

            用户问题：{{#parse.query#}}


            报告草稿：

            {{#parse.full_report#}}


            过程数据 JSON：{{#parse.data_logs_json#}}

            纠错 JSON：{{#parse.corrections_json#}}

            风险标记：{{#metrics.risk_flags#}}


            请用中文分点回答，结合学生草稿与过程数据，不编造未出现的测量值。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: answer
      type: custom
      width: 244
      height: 54
      position:
        x: 1780
        y: 300
      positionAbsolute:
        x: 1780
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 回答
        type: answer
        selected: false
        answer: '{{#llm_check.text#}}{{#llm_error.text#}}{{#llm_table.text#}}{{#llm_general.text#}}'
        variables: []
