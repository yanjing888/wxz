    - data:
        code: |
          import re


          def main(student_report="", experiment_guide_text=""):
              text = student_report or ""
              guide = experiment_guide_text or ""
              has_uncertainty = bool(re.search(r"不确定|误差|标准差|相对|±|\+/-", text))
              has_unit = bool(re.search(r"(mm|cm|m|nm|N|kN|MPa|Pa|kg|g|s|V|A|Ω|ohm|℃)", text, re.I))
              word_count = len(re.sub(r"\s+", "", text))
              section_hits = []
              for label in ["实验目的", "实验原理", "实验仪器", "实验步骤", "数据", "结果", "讨论", "分析"]:
                  if label in text:
                      section_hits.append(label)
              risk = []
              if word_count < 180:
                  risk.append("正文偏短")
              if not has_uncertainty:
                  risk.append("缺少不确定度/误差分析")
              if not has_unit:
                  risk.append("单位痕迹不足")
              if not guide:
                  risk.append("未收到实验目的与步骤")
              if len(section_hits) < 3:
                  risk.append("报告结构不完整")
              review_route = "empty" if word_count < 80 else "review"
              return {
                  "word_count": word_count,
                  "section_count": len(section_hits),
                  "filled_sections": "、".join(section_hits) if section_hits else "未识别到标准章节",
                  "has_uncertainty": has_uncertainty,
                  "has_unit": has_unit,
                  "risk_flags": "；".join(risk) if risk else "未发现明显硬性风险",
                  "review_route": review_route,
              }
        code_language: python3
        outputs:
          filled_sections:
            children: null
            type: string
          has_uncertainty:
            children: null
            type: boolean
          has_unit:
            children: null
            type: boolean
          review_route:
            children: null
            type: string
          risk_flags:
            children: null
            type: string
          section_count:
            children: null
            type: number
          word_count:
            children: null
            type: number
