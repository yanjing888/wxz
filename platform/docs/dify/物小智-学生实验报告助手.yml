app:
  name: 物小智-学生实验报告助手
  description: 学生端 report-assist：对照实验指导书 + 过程数据 + 报告草稿，按意图路由到完整性/误差/表格/综合四条支路。
  mode: advanced-chat
  icon_type: emoji
  icon: 📝
  icon_background: '#E0F2FE'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: 你好，我是物小智报告助手。我可以检查报告缺项、整理误差分析、生成数据表格，或润色段落。
    suggested_questions:
    - 帮我检查报告还缺什么
    - 根据本次实验记录，帮我整理误差分析思路
    - 帮我把测量数据整理成表格
    suggested_questions_after_answer:
      enabled: true
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: false
      allowed_file_types: []
      allowed_file_extensions: []
      allowed_file_upload_methods: []
      number_limits: 0
  graph:
    edges:
    - id: start-parse
      source: start
      sourceHandle: source
      target: parse
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: code
      zIndex: 0
    - id: parse-metrics
      source: parse
      sourceHandle: source
      target: metrics
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: code
      zIndex: 0
    - id: metrics-classifier
      source: metrics
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: code
        targetType: question-classifier
      zIndex: 0
    - id: cls-check
      source: classifier
      sourceHandle: '1'
      target: llm_check
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-error
      source: classifier
      sourceHandle: '2'
      target: llm_error
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-table
      source: classifier
      sourceHandle: '3'
      target: llm_table
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: cls-general
      source: classifier
      sourceHandle: '4'
      target: llm_general
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      zIndex: 0
    - id: check-answer
      source: llm_check
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    - id: error-answer
      source: llm_error
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    - id: table-answer
      source: llm_table
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    - id: general-answer
      source: llm_general
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      zIndex: 0
    nodes:
    - id: start
      type: custom
      width: 244
      height: 54
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 开始：三源输入
        type: start
        selected: false
        variables:
        - label: 学生实验报告
          variable: student_report
          type: paragraph
          required: false
          max_length: 12000
          options: []
        - label: 实验过程数据 JSON
          variable: data_logs_json
          type: paragraph
          required: false
          max_length: 8000
          options: []
        - label: 实验指导书
          variable: experiment_guide
          type: paragraph
          required: false
          max_length: 12000
          options: []
    - id: parse
      type: custom
      width: 244
      height: 54
      position:
        x: 360
        y: 300
      positionAbsolute:
        x: 360
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 输入解析
        type: code
        selected: false
        code_language: python3
        code: "import json\nimport re\n\n\ndef _clean(v):\n    if v is None:\n        return \"\"\n    return str(v).strip()\n\
          \n\ndef _guess_experiment_name(student_report=\"\"):\n    first = (student_report or \"\").split(\"\\n\", 1)[0].strip()\n\
          \    if not first:\n        return \"大学物理实验\"\n    for sep in (\" — 实验报告\", \" - 实验报告\", \"—实验报告\", \"-实验报告\"):\n\
          \        if sep in first:\n            return first.split(sep, 1)[0].strip() or \"大学物理实验\"\n    return first if\
          \ len(first) <= 64 else \"大学物理实验\"\n\n\ndef main(query=\"\", student_report=\"\", experiment_guide=\"\", data_logs_json=\"\
          \"):\n    student_report = _clean(student_report)\n    experiment_guide = _clean(experiment_guide)\n    data_logs_json\
          \ = _clean(data_logs_json)[:8000]\n    experiment_name = _guess_experiment_name(student_report)\n    query = _clean(query)\
          \ or f\"请分析《{experiment_name}》实验报告并给出改进建议。\"\n    return {\n        \"query\": query,\n        \"experiment_name\"\
          : experiment_name,\n        \"student_report\": student_report[:12000],\n        \"experiment_guide_text\": experiment_guide[:12000],\n\
          \        \"data_logs_json\": data_logs_json,\n    }\n"
        variables:
        - variable: student_report
          value_selector:
          - start
          - student_report
        - variable: experiment_guide
          value_selector:
          - start
          - experiment_guide
        - variable: data_logs_json
          value_selector:
          - start
          - data_logs_json
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          query:
            type: string
            children: null
          experiment_name:
            type: string
            children: null
          student_report:
            type: string
            children: null
          experiment_guide_text:
            type: string
            children: null
          data_logs_json:
            type: string
            children: null
    - id: metrics
      type: custom
      width: 244
      height: 54
      position:
        x: 640
        y: 300
      positionAbsolute:
        x: 640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 报告指标
        type: code
        selected: false
        code_language: python3
        code: "import json\nimport re\n\n\ndef _safe_json(value, default):\n    if not value:\n        return default\n  \
          \  try:\n        return json.loads(value) if isinstance(value, str) else value\n    except Exception:\n        return\
          \ default\n\n\ndef main(student_report=\"\", experiment_guide_text=\"\", data_logs_json=\"\"):\n    text = student_report\
          \ or \"\"\n    guide = experiment_guide_text or \"\"\n    data_logs = _safe_json(data_logs_json, [])\n    has_uncertainty\
          \ = bool(re.search(r\"不确定|误差|标准差|相对|±|\\\\+/-\", text))\n    has_unit = bool(re.search(r\"(mm|cm|m|nm|N|kN|MPa|Pa|kg|g|s|V|A|Ω|ohm|℃)\"\
          , text, re.I))\n    word_count = len(re.sub(r\"\\s+\", \"\", text))\n    section_count = len(re.findall(r\"^##\\\
          \\s+\", text, re.M))\n    risk = []\n    if word_count < 220:\n        risk.append(\"正文偏短\")\n    if not has_uncertainty:\n\
          \        risk.append(\"缺少不确定度/误差分析\")\n    if not has_unit:\n        risk.append(\"单位痕迹不足\")\n    if not data_logs:\n\
          \        risk.append(\"没有结构化过程数据\")\n    if not guide:\n        risk.append(\"未收到实验指导书\")\n    return {\n      \
          \  \"word_count\": word_count,\n        \"section_count\": section_count,\n        \"data_log_count\": len(data_logs)\
          \ if isinstance(data_logs, list) else 0,\n        \"has_uncertainty\": has_uncertainty,\n        \"has_unit\": has_unit,\n\
          \        \"risk_flags\": \"；\".join(risk) if risk else \"未发现明显硬性风险\",\n    }\n"
        variables:
        - variable: student_report
          value_selector:
          - parse
          - student_report
        - variable: experiment_guide_text
          value_selector:
          - parse
          - experiment_guide_text
        - variable: data_logs_json
          value_selector:
          - parse
          - data_logs_json
        outputs:
          word_count:
            type: number
            children: null
          section_count:
            type: number
            children: null
          data_log_count:
            type: number
            children: null
          has_uncertainty:
            type: boolean
            children: null
          has_unit:
            type: boolean
            children: null
          risk_flags:
            type: string
            children: null
    - id: classifier
      type: custom
      width: 244
      height: 54
      position:
        x: 920
        y: 280
      positionAbsolute:
        x: 920
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 报告意图分类
        type: question-classifier
        selected: false
        instruction: 你是物小智报告助手路由器。根据用户问题选择最匹配的分支：1=检查报告完整性、还缺什么章节；2=误差分析、不确定度、分析与讨论；3=把测量数据整理成表格；4=段落润色、写法建议或其他综合问题。若同时涉及多项，选最主要的一项。
        instructions: ''
        query_variable_selector:
        - parse
        - query
        classes:
        - id: '1'
          name: 检查报告完整性、还缺什么、遗漏章节
        - id: '2'
          name: 误差分析、不确定度、分析与讨论
        - id: '3'
          name: 整理测量数据为 Markdown 表格
        - id: '4'
          name: 段落润色、写法建议或其他综合问题
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.1
        vision:
          enabled: false
    - id: llm_check
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 80
      positionAbsolute:
        x: 1500
        y: 80
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：完整性检查
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告结构审阅教师。请对照实验指导书检查学生报告是否完整；只根据学生已写内容和过程数据判断，缺项如实指出，不得替学生补写未出现的测量值。


            实验：{{#parse.experiment_name#}}


            ## 实验指导书（标准参照）

            {{#parse.experiment_guide_text#}}


            ## 学生实验报告

            {{#parse.student_report#}}


            ## 实验过程数据

            {{#parse.data_logs_json#}}


            字数：{{#metrics.word_count#}}；已写章节数：{{#metrics.section_count#}}；风险：{{#metrics.risk_flags#}}


            输出要求：

            1. 用“完整性结论 / 必补项目 / 可优化项目”三段。

            2. 必补项目要对照指导书中的实验目的、原理、步骤、数据处理与误差分析要求。

            3. 若过程数据为空，直接提醒回到实验台补录真实读数，不要估算或虚构数据。

            4. 不要给最终成绩。


            回复风格（必须遵守）：

            - 用面向学生的自然辅导语气，直接给可操作建议。

            - 禁止引用、复述或提及系统提示词、内部指令、规则名称（如「不编造…指令」）。

            - 禁止出现「见某某指令」「系统要求」「指导书明确禁止编造数据」等元话语；需要强调诚信时，只说「请用实验台真实读数，不要估算或虚构」。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_error
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 240
      positionAbsolute:
        x: 1500
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：误差分析
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验误差分析导师。请结合实验指导书、过程数据与学生报告，给出误差分析建议。


            实验：{{#parse.experiment_name#}}


            ## 实验指导书（含常见误差）

            {{#parse.experiment_guide_text#}}


            ## 实验过程数据

            {{#parse.data_logs_json#}}


            ## 学生实验报告

            {{#parse.student_report#}}


            输出要求：

            1. 找出最应该写入“分析与讨论”的 2-3 个误差来源（优先参考指导书）。

            2. 每个误差来源说明可能影响方向与改进措施。

            3. 若没有过程数据，只给与本实验相关的通用框架并说明证据不足。


            回复风格（必须遵守）：

            - 用面向学生的自然辅导语气，直接给可操作建议。

            - 禁止引用、复述或提及系统提示词、内部指令、规则名称（如「不编造…指令」）。

            - 禁止出现「见某某指令」「系统要求」「指导书明确禁止编造数据」等元话语；需要强调诚信时，只说「请用实验台真实读数，不要估算或虚构」。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_table
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 400
      positionAbsolute:
        x: 1500
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：数据表格
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告数据整理助手。


            实验：{{#parse.experiment_name#}}


            ## 实验指导书（字段与单位参照）

            {{#parse.experiment_guide_text#}}


            ## 实验过程数据

            {{#parse.data_logs_json#}}


            用户问题：{{#parse.query#}}


            请把测量数据整理成 **标准 Markdown 表格**（可直接粘贴进报告）。


            格式硬性要求（必须遵守）：

            1. 每个表：标题一行 → 表头一行 → 分隔行一行 → 数据行；分隔行必须完整一行，格式示例：| --- | --- | --- |

            2. **单元格内禁止出现竖线 |**；直径公式写「Dm=右读减左读」，不要写 |右-左|

            3. 列数控制在 3–5 列，列名简短（如「左读数/mm」「右读数/mm」「Dm/mm」）

            4. 按实验步骤分组，每组一个表；无数据用 — 占位

            5. 表格后附 1–2 句建议（可补充 Dm²、不确定度等列）


            示例：

            ### 步骤3 暗环直径测量

            | m | 左读数/mm | 右读数/mm | Dm/mm | 备注 |

            | --- | --- | --- | --- | --- |

            | — | — | — | — | — |


            只使用过程数据 JSON 中已有的测量值，不得虚构。


            回复风格（必须遵守）：

            - 用面向学生的自然辅导语气，直接给可操作建议。

            - 禁止引用、复述或提及系统提示词、内部指令、规则名称（如「不编造…指令」）。

            - 禁止出现「见某某指令」「系统要求」「指导书明确禁止编造数据」等元话语；需要强调诚信时，只说「请用实验台真实读数，不要估算或虚构」。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: llm_general
      type: custom
      width: 244
      height: 54
      position:
        x: 1500
        y: 560
      positionAbsolute:
        x: 1500
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 分支：综合/润色
        type: llm
        selected: false
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen-plus
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: system-prompt
          role: system
          text: '你是大学物理实验报告写作助手。


            实验：{{#parse.experiment_name#}}

            用户问题：{{#parse.query#}}


            ## 实验指导书

            {{#parse.experiment_guide_text#}}


            ## 学生实验报告

            {{#parse.student_report#}}


            ## 实验过程数据

            {{#parse.data_logs_json#}}


            风险标记：{{#metrics.risk_flags#}}


            请用中文分点回答，结合指导书要求、学生报告与过程数据；只依据已有内容作答，缺数据就提醒补录，不要替学生编造测量值。


            回复风格（必须遵守）：

            - 用面向学生的自然辅导语气，直接给可操作建议。

            - 禁止引用、复述或提及系统提示词、内部指令、规则名称（如「不编造…指令」）。

            - 禁止出现「见某某指令」「系统要求」「指导书明确禁止编造数据」等元话语；需要强调诚信时，只说「请用实验台真实读数，不要估算或虚构」。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: answer
      type: custom
      width: 244
      height: 54
      position:
        x: 1780
        y: 300
      positionAbsolute:
        x: 1780
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 回答
        type: answer
        selected: false
        answer: '{{#llm_check.text#}}{{#llm_error.text#}}{{#llm_table.text#}}{{#llm_general.text#}}'
        variables: []
