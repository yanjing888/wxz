<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,"><title>牛顿环 · 仿真练习</title>
  <link rel="stylesheet" href="./simulation.css"><link rel="stylesheet" href="./student.css"><link rel="stylesheet" href="./immersive.css">
</head>
<body class="student-simulation immersive">
  <header class="practice-header"><b class="experiment-title">牛顿环实验</b><nav id="journey" class="journey" aria-label="预习导航"></nav><button id="fullscreen" class="quiet-button">全屏</button></header>
  <main class="workspace">
    <section class="scene-panel" aria-label="三维实验台">
      <div id="viewport"><div id="loading">正在加载仪器…</div><div id="labels"></div><div id="filmExplanation" hidden><b>空气膜的两束反射光</b><p>黄：入射光；绿、紫：空气膜上下界面的反射光。</p></div></div>
      <div class="scene-actions"><button id="stepsToggle" aria-expanded="false" aria-controls="stepsPanel">操作步骤</button><button id="explodedToggle" aria-pressed="false" hidden>查看爆炸图</button></div>
      <div class="scene-utilities"><button data-view="home" title="恢复整体视角">复位视角</button><button id="observationToggle" aria-expanded="false" aria-controls="observationPanel" hidden>观察视场</button><button id="toolsToggle" aria-expanded="false" aria-controls="toolsPanel">工具</button></div>
      <section id="currentTask" class="current-task" aria-label="当前操作"><img id="taskThumb" alt="当前操作部件"><div class="task-copy"><span id="taskNumber"></span><h2 id="taskTitle"></h2><p id="taskInstruction"></p></div><button id="taskAction" class="primary"></button></section>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
    <aside id="stepsPanel" class="left-panel panel" aria-label="操作步骤" hidden>
      <div class="drawer-heading"><b id="stageTitle">操作步骤</b><button id="closeSteps" aria-label="收起步骤">收起</button></div>
      <div class="progress-track"><div id="progressBar"></div></div><div id="guideContent"></div>
      <div class="guide-footer"><span id="progressText"></span><button id="nextStage" class="primary"></button></div>
    </aside>
    <aside id="observationPanel" class="observation-panel" aria-label="观察视场" hidden>
      <div class="drawer-heading"><b>观察视场</b><button id="closeObservation" aria-label="收起视场">收起</button></div>
      <div class="observation"><canvas id="rings" width="480" height="270" aria-label="干涉环实时观察视场"></canvas><span id="fieldStatus" role="status"></span></div>
    </aside>
    <aside id="toolsPanel" class="right-panel panel" aria-label="仿真工具" hidden>
      <div class="drawer-heading"><b>工具</b><button id="closeTools" aria-label="收起工具">收起</button></div>
      <details id="lightPathDetails" open><summary>光路原理学习</summary><div id="lightPathLearning"></div></details>
      <details id="connectionsDetails"><summary>电源与接线</summary><section class="connection-panel">
        <label class="switch-row">钠光灯<input id="lampSwitch" type="checkbox"></label><label class="switch-row">CCD 电源<input id="cameraPowerSwitch" type="checkbox"></label><label class="switch-row">视频线<input id="videoCableSwitch" type="checkbox"></label><label class="switch-row">显示器电源<input id="monitorPowerSwitch" type="checkbox"></label><p id="signalStatus" role="status"></p>
      </section></details>
      <details><summary>视图选项</summary><div class="view-options"><button data-view="optics">光学组件</button><button data-view="film">空气膜剖面</button><button id="raysToggle" aria-pressed="true">显示光路</button><button id="xrayToggle" aria-pressed="false">镜筒透视</button><button id="labelToggle" aria-pressed="false">全部标注</button><button id="backgroundToggle" aria-pressed="true">动态背景</button></div></details>
      <details id="partsDetails"><summary>部件与调节</summary><div id="partsList" class="parts-list"></div><div class="part-summary"><h2 id="partName"></h2><p id="partDescription"></p><p id="partTip"></p></div><div id="componentControl"></div></details>
      <button id="reset" class="text-button">重新预习</button>
    </aside>
  </main>
  <div hidden aria-hidden="true"><span id="stageCount"></span><span id="stageIntro"></span><span id="sceneTitle"></span><span id="elapsed"></span><span id="assemblyStatus"></span><span id="modelHint"></span><span id="observationMode"></span><span id="brightnessMetric"></span><span id="sharpnessMetric"></span><span id="contrastMetric"></span><span id="partReference"></span></div>
  <dialog id="reportDialog"><div class="report-actions"><b>预习结果报告</b><button id="closeReport" aria-label="关闭报告">✕</button></div><div id="reportBody"></div><div class="report-buttons"><button id="downloadReport" class="primary">下载报告 DOCX</button><button id="downloadJson">下载数据 JSON</button><button id="printReport">打印 / 存为 PDF</button></div></dialog>
  <script type="module" src="./student.js"></script>
</body>
</html>
